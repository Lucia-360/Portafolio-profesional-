<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreativeJob</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>CreativeJob</h1>
<p>Aprende a crear un mejor portafolio y currículum para conseguir el trabajo que deseas.</p>
<a href="#registro">Comenzar</a>
</header>
<section id="registro">
<h2>Registro</h2>
<form id="registroForm">
<input type="text" id="nombre" placeholder="Nombre" required>
<input type="email" id="correo" placeholder="Correo" required>
<input type="tel" id="telefono" placeholder="Teléfono" required>
<select id="profesion">
<option>Artista</option><option>Fotógrafo</option><option>Ilustrador</option><option>Diseñador</option><option>Otro</option>
</select>
<button type="submit">Guardar</button>
</form>
</section>
<section id="bienvenida"><h2>Bienvenido</h2><p id="mensaje"></p></section>
<script src="script.js"></script>
</body></html>
